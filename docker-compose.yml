services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appforge
      POSTGRES_USER: appforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-appforge-local-dev-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appforge -d appforge"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://appforge:${POSTGRES_PASSWORD:-appforge-local-dev-only}@db:5432/appforge
      APPFORGE_WORKER_POLL_SECONDS: ${APPFORGE_WORKER_POLL_SECONDS:-2}
    command: ["python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-AppForge}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://appforge:${POSTGRES_PASSWORD:-appforge-local-dev-only}@db:5432/appforge
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres_data:
